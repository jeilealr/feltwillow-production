name: Repository consistency

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'Pillow>=10,<12' 'PyYAML>=6,<7'
      - name: Unit and repository checks
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile production Python
        run: python -m compileall -q feltwillow production
